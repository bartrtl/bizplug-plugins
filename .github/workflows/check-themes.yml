name: Check card themes

on:
  pull_request:
    paths: ["themes/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check every theme file the pull request adds or changes
        run: |
          files=$(git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}...HEAD" -- 'themes/*.json')
          if [ -z "$files" ]; then echo "No theme files changed."; exit 0; fi
          other=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -v '^themes/[a-z-]*\.json$' || true)
          if [ -n "$other" ]; then echo "A theme pull request changes only files in themes/. Also changed:"; echo "$other"; exit 1; fi
          for f in $files; do npx --yes tsx themes/check-theme.ts "$f"; done
